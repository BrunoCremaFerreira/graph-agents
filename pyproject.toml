[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhizome-graph"
version = "0.0.0"
description = "Adapter that turns Claude Code hook events into a Gource-style event stream."
requires-python = ">=3.10"
dependencies = []

# The front door. `rhi` is typed once per session, so it is short; the target is
# `rhizome_graph.cli:main`, which prints `--help` and `--version` without
# importing anything from the daemon side.
#
# `rhi-hook` is the command a `.claude/settings.json` in another project names.
# Its target is inside `rhizome_graph` on purpose: `hooks/` is not in
# `[tool.setuptools] packages`, so a hook block pointing there names a file that
# only exists inside somebody's checkout -- and a rename, a move or a `rm -rf`
# then returns a blocking hook error on every single tool call.
[project.scripts]
rhi = "rhizome_graph.cli:main"
rhi-hook = "rhizome_graph.hook:main"

[project.optional-dependencies]
# The daemon may use third-party deps; the hook (hooks/emit_event.py) MUST stay
# stdlib-only and is intentionally excluded from any dependency here.
# websockets floor: daemon/server.py imports `websockets.asyncio.server`, which
# first ships in the 13 series (12.0 has no `websockets/asyncio/` at all).
# watchdog floor: daemon/watcher.py uses only FileSystemEvent,
# FileSystemEventHandler and Observer, all present in 3.0.0, and the suite is
# green there -- so 3 keeps Debian's python3-watchdog usable.
daemon = ["websockets>=13", "watchdog>=3"]
dev = ["pytest>=7", "websockets>=13", "watchdog>=3"]

# Only the two import packages are declared here, and the built front end is
# deliberately NOT one of them. It still ships -- inside `rhizome_graph/web/`,
# the one place `rhizome_graph.assets.web_dist_candidates()` looks in an
# installed distribution; shipped anywhere else (a top-level `web/`, `share/`,
# `data_files`) the daemon never opens it and the page is blank while everything
# else reports success. What carries it there is `setup.py`, which copies
# `web/dist` into the build tree as package data of `rhizome_graph`.
#
# It has to be done at build time and not by config, because `web/dist` is
# gitignored build output that usually does not exist. A `packages` entry with a
# `package-dir` pointing at it -- which is how this was written first -- makes
# setuptools resolve that directory while it is producing *metadata*, so on a
# clean checkout `pip install -e '.[daemon]'` and `python -m build` both die with
# `package directory 'web/dist' does not exist`, and `start.sh` can never
# bootstrap past its own first step. Copying instead of mapping means a missing
# `web/dist` is simply nothing to copy. See `tests/test_distribution_metadata.py`
# for that half and `tests/test_distribution_front_end.py` for the other.
[tool.setuptools]
packages = ["rhizome_graph", "daemon"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
