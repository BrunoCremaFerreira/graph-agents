<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>graph-agents — live agent activity</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <ol id="log"></ol>
      <div id="attribution" hidden></div>
      <div class="about">
        graph-agents · Gource-style live view
        <span class="keys">
          scroll: zoom · drag: pan · double-click: auto-fit · ctrl+F: search · F3: next
        </span>
      </div>
    </div>
    <div id="context">
      <span id="context-root"></span><span id="context-branch" hidden></span>
    </div>
    <div id="search" hidden>
      <input
        id="search-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="search file or folder"
      />
      <span id="search-count"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
